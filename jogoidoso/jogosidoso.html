<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelo - Jogos para a Memória</title>
    <link href="jogosidoso.css" rel="stylesheet">
    <link rel="stylesheet" href="../assistente/assistente.css">
</head>
<body>

    <header class="navbar">
       <div class="logo">
            <img src="zelo.png" alt="logo zelo" width="500" height="300">
        </div>
    </header>

    <main class="main-container">
        
        <section class="left-sidebar">
            <div class="assistant-wrapper">
                <img src="idososorrindoapontandoparabaixo.png" alt="Assistente Zelo" class="assistant-img">
            </div>
            <button class="btn-global-help">CLIQUE AQUI PARA RECEBER AJUDA!</button>
            <button class="btn-global-sos"><span class="alert-emoji">🚨</span> PEDIR SOCORRO A FAMILIAR</button>
        </section>

        <section class="games-container">
            <h1 class="games-title">JOGOS PARA A MEMORIA</h1>

            <div class="games-panel">
                <div class="games-grid">
                    
                    <a href="frutas.html" class="game-card">
                        <div class="game-thumb">
                            <img src="jogofrutas.png" alt="Jogo das Frutas">
                        </div>
                        <span class="game-label">JOGO DAS FRUTAS</span>
                    </a>

                    <a href="memoria.html" class="game-card">
                        <div class="game-thumb">
                            <img src="jogomemoria1.png" alt="Jogo da Memória">
                        </div>
                        <span class="game-label">JOGO DA MEMORIA</span>
                    </a>

                    <a href="quebra_cabeca.html" class="game-card">
                        <div class="game-thumb">
                            <img src="jogoquebracabeca1.png" alt="Quebra-Cabeça Arara">
                        </div>
                        <span class="game-label">QUEBRA-CABEÇA</span>
                    </a>

                    <a href="cores.html" class="game-card">
                        <div class="game-thumb">
                            <img src="jogocores.png" alt="Jogo das Cores">
                        </div>
                        <span class="game-label">JOGO DAS CORES</span>
                    </a>

                    <a href="quebra_cabeca2.html" class="game-card">
                        <div class="game-thumb">
                            <img src="jogoquebracabeca2.png" alt="Quebra-Cabeça Cão">
                        </div>
                        <span class="game-label">QUEBRA-CABEÇA</span>
                    </a>

                    <a href="cartas.html" class="game-card">
                        <div class="game-thumb">
                            <img src="jogocartas.png" alt="Jogo de Cartas">
                        </div>
                        <span class="game-label">JOGO DE CARTAS</span>
                    </a>

                </div>
            </div>
        </section>

    </main>

    <script src="jogos.js"></script>
    <script src="../assistente/assistente.js"></script>
</body>
</html>
