<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelo - Médico Online</title>
    <link href="medicoidoso.css" rel="stylesheet">
    <link rel="stylesheet" href="../assistente/assistente.css">
</head>
<body>

    <header class="navbar">
          <div class="logo">
            <img src="zelo.png" alt="logo zelo" width="500" height="300">
        </div>
    </header>

    <main class="main-container">
        
        <section class="assistant-container">
            <div class="image-wrapper">
                <img src="idososorrindoapontandoparabaixo.png" alt="Assistente Zelo" class="assistant-img">
            </div>
            <button class="btn-help">CLIQUE AQUI PARA RECEBER AJUDA!</button>
            <button class="btn-sos"><span class="emoji">🚨</span> PEDIR SOCORRO A FAMILIAR</button>
        </section>

        <section class="medico-container">
            <h1 class="main-title">MEDICO ONLINE</h1>

            <div class="medico-panel">
                
                <a href="#" class="btn-call-doctor">
                    FALAR COM UM MÉDICO AGORA
                </a>

                <div class="sintomas-box">
                    <textarea class="sintomas-input" placeholder="ESCREVA AQUI O QUE ESTA SENTINDO OU MANDE UM AUDIO CONTANDO"></textarea>
                </div>

                <div class="audio-section">
                    <p class="audio-instruction">
                        CLIQUE NO ICONE DE MICROFONE PARA GRAVAR UM AUDIO
                    </p>
                    <button class="btn-mic" title="Gravar Áudio">
                       
                    </button>
                </div>

            </div>
        </section>

    </main>

    
    

    <script src="medico.js"></script>
    <script src="../assistente/assistente.js"></script>
</body>
</html>
